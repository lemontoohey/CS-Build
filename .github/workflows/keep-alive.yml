name: Keep Render app awake

# Render's free tier spins the app down after ~15 minutes with no traffic.
# This pings the live URL every 10 minutes so it never gets the chance --
# well inside that 15-minute window, with margin for GitHub's own scheduling
# delays. Costs nothing: Actions minutes are unlimited on public repos.
#
# Note: GitHub automatically disables scheduled workflows after 60 days with
# no commits to the repo. If pings stop, push anything (or re-enable it from
# the Actions tab) to restart the schedule.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live app
        run: curl -fsS --max-time 30 https://house-cooper-build-tool.onrender.com/ > /dev/null
